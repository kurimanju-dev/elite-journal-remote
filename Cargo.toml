[package]
name = "elite-journal-relay"
version = "0.3.0"
edition = "2024"
description = "Copy Elite Dangerous journals between computers"
license = "MIT"
build = "build.rs"
autobins = false

[[bin]]
name = "elite-journal-relay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = { version = "1", features = ["pure"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
if-addrs = "0.15"
mdns-sd = "0.20"
notify = { version = "8.2", default-features = false, features = ["macos_kqueue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Console", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = ["ring", "tls12"]

[dependencies.rustls-pemfile]
version = "2"

[dependencies.rcgen]
version = "0.14"

[dependencies.webpki-roots]
version = "1"

[dependencies.socket2]
version = "0.6"
features = ["all"]

[build-dependencies]
getrandom = "0.3"

[profile.release]
lto = "thin"
strip = true

[workspace]
members = ["desktop/src-tauri"]
default-members = ["."]
resolver = "2"
