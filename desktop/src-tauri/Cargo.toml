[package]
name = "elite-relay-desktop"
version = "0.3.0"
edition = "2024"
description = "Desktop app for Elite Journal Relay"
license = "MIT"
build = "build.rs"

[[bin]]
name = "elite-relay"
path = "src/main.rs"

[dependencies]
elite-journal-relay = { path = "../.." }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "rt", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
